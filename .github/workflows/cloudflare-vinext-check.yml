name: Cloudflare vinext compatibility check

on:
  push:
    branches:
      - cloudflare/vinext-migration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-vinext-migration-ci
  cancel-in-progress: false

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install existing project dependencies
        run: npm ci

      - name: Apply non-breaking dependency security updates
        run: npm audit fix || echo 'Some advisories require manual review or a major version update.'

      - name: Report production dependency audit
        run: |
          npm audit --omit=dev --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json"); console.log("Production audit summary:", JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name,v] of Object.entries(a.vulnerabilities ?? {})) console.log(name, "|", v.severity, "| direct:", v.isDirect, "| range:", v.range, "| via:", JSON.stringify(v.via), "| fix:", JSON.stringify(v.fixAvailable));'

      - name: Run the official vinext compatibility check
        run: npx --yes vinext check

      - name: Build the Cloudflare Worker including scheduled entrypoint
        run: npm run build:vinext
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: BElhY2ktcGxhY2Vob2xkZXI

      - name: Validate Cloudflare deployment configuration (dry run)
        run: |
          cat > /tmp/worker-secrets <<'EOF'
          SUPABASE_SERVICE_ROLE_KEY=ci-placeholder
          OPENAI_API_KEY=ci-placeholder
          VAPID_PRIVATE_KEY=ci-placeholder
          VAPID_SUBJECT=mailto:ci@example.com
          CRON_SECRET=ci-placeholder
          ADMIN_EMAILS=ci@example.com
          EOF
          npx @vinext/cloudflare deploy --dry-run
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: BElhY2ktcGxhY2Vob2xkZXI

      - name: Commit safe lockfile security updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No safe lockfile updates were needed."
          else
            git commit -m "Apply non-breaking dependency security updates"
            git push origin HEAD:cloudflare/vinext-migration
          fi
