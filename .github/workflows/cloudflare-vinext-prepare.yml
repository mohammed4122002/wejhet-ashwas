name: Prepare vinext for Cloudflare

on:
  push:
    branches:
      - cloudflare/vinext-migration
    paths:
      - ".github/workflows/cloudflare-vinext-prepare.yml"
      - "cloudflare.config.ts"
      - "vite.config.ts"
      - "worker/**"
      - "src/app/api/**"
      - "src/lib/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-vinext-prepare
  cancel-in-progress: false

jobs:
  prepare-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare/vinext-migration

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install existing dependencies
        run: npm ci

      - name: Align Next.js and React with vinext requirements
        run: >-
          npm install
          next@15.5.29
          react@19.3.1
          react-dom@19.3.1
          @types/react@^19
          @types/react-dom@^19
          eslint-config-next@15.5.29

      - name: Initialize vinext for Cloudflare Workers
        run: >-
          npx --yes vinext init
          --platform=cloudflare
          --name=wejhet-ashwas
          --cdn-cache=none
          --data-cache=none
          --image-optimization=none
          --no-prerender

      - name: Build production Worker
        run: npm run build:vinext
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: BElhY2ktcGxhY2Vob2xkZXI

      - name: Commit generated migration configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json vite.config.ts cloudflare.config.ts .gitignore
          if git diff --cached --quiet; then
            echo "No generated configuration changes to commit."
          else
            git commit -m "Prepare vinext Cloudflare Workers configuration"
            git push origin HEAD:cloudflare/vinext-migration
          fi
